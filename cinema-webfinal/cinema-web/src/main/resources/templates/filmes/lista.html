<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Filmes')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('filmes')}"></header>
<main>
    <h1>Filmes</h1>

    <div th:replace="~{fragments/layout :: avisos}"></div>

    <form class="card filtros" th:action="@{/filmes}" method="get">
        <div class="campo">
            <label for="busca">Buscar por título</label>
            <input id="busca" type="search" name="busca" th:value="${busca}">
        </div>
        <div class="campo">
            <label for="classificacao">Classificação indicativa</label>
            <select id="classificacao" name="classificacao" onchange="this.form.submit()">
                <option value="">Todas</option>
                <option th:each="c : ${classificacoes}" th:value="${c}" th:text="${c}"
                        th:selected="${c == classificacao}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="generoId">Gênero</label>
            <select id="generoId" name="generoId" onchange="this.form.submit()">
                <option value="">Todos</option>
                <option th:each="g : ${generos}" th:value="${g.id}" th:text="${g.nome}"
                        th:selected="${generoId != null and generoId == g.id}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="ordem">Ordenar por</label>
            <select id="ordem" name="ordem" onchange="this.form.submit()">
                <option value="titulo" th:selected="${ordem == 'titulo'}">Título (A–Z)</option>
                <option value="titulo_desc" th:selected="${ordem == 'titulo_desc'}">Título (Z–A)</option>
                <option value="classificacao" th:selected="${ordem == 'classificacao'}">Classificação indicativa</option>
                <option value="genero" th:selected="${ordem == 'genero'}">Gênero (A–Z)</option>
            </select>
        </div>
        <div class="botoes">
            <button class="btn" type="submit">Filtrar</button>
            <a class="btn" th:href="@{/filmes}">Limpar</a>
        </div>
    </form>

    <div class="barra">
        <span class="dica" th:text="${filmes.size()} + (${filmes.size() == 1} ? ' filme' : ' filmes')">3 filmes</span>
        <a class="btn primario" th:href="@{/filmes/novo}">+ Novo filme</a>
    </div>

    <div class="card">
        <div class="tabela-wrap" th:if="${!filmes.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>Título</th><th>Gêneros</th><th>Duração</th><th>Class.</th><th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${filmes}">
                    <td th:text="${f.titulo}">Título</td>
                    <td class="chips-cel">
                        <span class="selo" th:each="g : ${f.generos}" th:text="${g.nome}">Drama</span>
                    </td>
                    <td th:text="${f.duracaoMin} + ' min'">120 min</td>
                    <td><span class="selo" th:text="${f.classificacao}">L</span></td>
                    <td class="acoes">
                        <a class="btn pequeno" th:href="@{/filmes/{id}/editar(id=${f.id})}">Editar</a>
                        <form th:action="@{/filmes/{id}/excluir(id=${f.id})}" method="post"
                              th:attr="data-msg='Excluir o filme ' + ${f.titulo} + '?'"
                              onsubmit="return confirm(this.dataset.msg);">
                            <button class="btn pequeno perigo" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="vazio" th:if="${filmes.isEmpty()}">Nenhum filme encontrado.</p>
    </div>
</main>
</body>
</html>
