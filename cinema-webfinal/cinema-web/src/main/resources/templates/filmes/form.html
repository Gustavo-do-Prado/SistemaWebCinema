<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho(${form.id == null ? 'Novo filme' : 'Editar filme'})}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('filmes')}"></header>
<main>
    <h1 th:text="${form.id == null} ? 'Novo filme' : 'Editar filme'">Novo filme</h1>

    <form class="card formulario" method="post" novalidate
          th:object="${form}"
          th:action="${form.id == null} ? @{/filmes} : @{/filmes/{id}(id=${form.id})}">

        <div class="campo">
            <label for="titulo">Título</label>
            <input id="titulo" type="text" th:field="*{titulo}" th:errorclass="invalido" maxlength="150" autofocus>
            <div class="erro" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="duracaoMin">Duração (minutos)</label>
                <input id="duracaoMin" type="number" min="1" th:field="*{duracaoMin}" th:errorclass="invalido">
                <div class="erro" th:if="${#fields.hasErrors('duracaoMin')}" th:errors="*{duracaoMin}"></div>
            </div>
            <div class="campo">
                <label for="classificacao">Classificação indicativa</label>
                <select id="classificacao" th:field="*{classificacao}" th:errorclass="invalido">
                    <option value="">Selecione...</option>
                    <option th:each="c : ${classificacoes}" th:value="${c}" th:text="${c}"></option>
                </select>
                <div class="erro" th:if="${#fields.hasErrors('classificacao')}" th:errors="*{classificacao}"></div>
            </div>
        </div>

        <fieldset class="campo grupo">
            <legend>Gêneros <span class="dica">(marque um ou mais)</span></legend>
            <div class="generos-grid">
                <label class="chk" th:each="g : ${generos}">
                    <input type="checkbox" th:field="*{generoIds}" th:value="${g.id}">
                    <span th:text="${g.nome}">Drama</span>
                </label>
            </div>
            <div class="erro" th:if="${#fields.hasErrors('generoIds')}" th:errors="*{generoIds}"></div>
        </fieldset>

        <div class="botoes">
            <button class="btn primario" type="submit">Salvar</button>
            <a class="btn" th:href="@{/filmes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
