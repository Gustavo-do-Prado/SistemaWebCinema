spring.application.name=cinema-web

# Banco MySQL (mesmo banco e credenciais do projeto JDBC; crie o banco com sql/Cinemaa.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/cinema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=123456

# O esquema já vem do Cinemaa.sql; o Hibernate não altera as tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Thymeleaf: sem cache em desenvolvimento (junto com o DevTools, recarrega ao salvar)
spring.thymeleaf.cache=false
