<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Sessões')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('sessoes')}"></header>
<main>
    <h1>Sessões</h1>
    <div th:replace="~{fragments/layout :: avisos}"></div>

    <form class="card filtros" th:action="@{/sessoes}" method="get">
        <div class="campo">
            <label for="filmeId">Filme</label>
            <select id="filmeId" name="filmeId" onchange="this.form.submit()">
                <option value="">Todos</option>
                <option th:each="f : ${filmes}" th:value="${f.id}" th:text="${f.titulo}"
                        th:selected="${filmeId != null and filmeId == f.id}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="salaId">Sala</label>
            <select id="salaId" name="salaId" onchange="this.form.submit()">
                <option value="">Todas</option>
                <option th:each="s : ${salas}" th:value="${s.id}" th:text="${s.nome}"
                        th:selected="${salaId != null and salaId == s.id}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="de">A partir de (data e hora)</label>
            <input id="de" type="datetime-local" name="de" th:value="${de}">
        </div>
        <div class="campo">
            <label for="ate">Até (data e hora)</label>
            <input id="ate" type="datetime-local" name="ate" th:value="${ate}">
        </div>
        <div class="botoes">
            <button class="btn" type="submit">Filtrar</button>
            <a class="btn" th:href="@{/sessoes}">Limpar</a>
        </div>
    </form>

    <div class="barra">
        <span class="dica" th:text="${sessoes.size()} + (${sessoes.size() == 1} ? ' sessão' : ' sessões')">3 sessões</span>
        <a class="btn primario" th:href="@{/sessoes/novo}">+ Nova sessão</a>
    </div>

    <div class="card">
        <div class="tabela-wrap" th:if="${!sessoes.isEmpty()}">
            <table>
                <thead><tr><th>Filme</th><th>Sala</th><th>Data e hora</th><th>Preço</th><th></th></tr></thead>
                <tbody>
                <tr th:each="s : ${sessoes}">
                    <td th:text="${s.filme.titulo}">Filme</td>
                    <td th:text="${s.sala.nome}">Sala 1</td>
                    <td th:text="${#temporals.format(s.dataHora, 'dd/MM/yyyy HH:mm')}">10/10/2026 19:00</td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(s.preco, 1, 'POINT', 2, 'COMMA')}">R$ 32,00</td>
                    <td class="acoes">
                        <a class="btn pequeno" th:href="@{/sessoes/{id}/editar(id=${s.id})}">Editar</a>
                        <form th:action="@{/sessoes/{id}/excluir(id=${s.id})}" method="post"
                              th:attr="data-msg='Excluir esta sessão? Os ingressos vendidos para ela também serão apagados.'"
                              onsubmit="return confirm(this.dataset.msg);">
                            <button class="btn pequeno perigo" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="vazio" th:if="${sessoes.isEmpty()}">Nenhuma sessão encontrada.</p>
    </div>
</main>
</body>
</html>
